name: Tests
on: [push, pull_request]

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - name: Check Linux PowerShell prerequisites
        if: runner.os == 'Linux'
        run: python -c "from llmopenchat.powershell import availability_error; error = availability_error(); assert error is None, error"
      - run: python -m unittest discover -s tests -v
      - name: Check Linux launchers
        if: runner.os == 'Linux'
        run: |
          sh -n Install.sh Start-Chat.sh Start-Telegram.sh
          python -m llmopenchat --help
          python -m llmopenchat doctor
